# Standalone AI Adapter service.
# Copy .env.example to .env before running `docker compose up --build`.

services:
  ai-adapters-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opennvr_ai_standalone
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ${MODEL_WEIGHTS_HOST_PATH}:/app/model_weights
      - ${FRAMES_HOST_PATH}:/app/frames
      - ${AUDIO_HOST_PATH}:/app/audio
