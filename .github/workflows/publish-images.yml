#
# Build + publish workflow for the per-adapter container images.
#
# Each of the six adapters in adapters/<name>/Dockerfile is built and
# pushed to GHCR as ghcr.io/open-nvr/<name>-adapter:<tags>. Operators
# pull these images straight from the OpenNVR Tier 0 docker-compose
# instead of building locally — a fresh install on a typical home
# machine drops from ~25 minutes (build all six from source) to under
# 5 minutes (pull yolov8 only, lazy-pull the rest).
#
# Triggered on:
#   - Pull request that touches an adapter's Dockerfile, its service
#     code, the SDK, or this workflow file        → build only, no push.
#     Catches "Dockerfile broken at boot" before merge.
#   - Push to main                                → build + push with
#     :main and :sha-<short> tags. Used by Tier 0 compose's :main pin
#     for the bleeding-edge install path.
#   - Tag matching ``v*``                          → build + push with
#     :<version>, :latest, :sha-<short> tags. The release path.
#
# Architecture: per-adapter, declared as ``platforms`` on each matrix
# entry rather than once for the whole job — the constraint is a
# property of an adapter's dependency graph, not of the workflow.
#
# An amd64-only manifest list is not a soft limitation for ARM
# operators: `docker compose pull` aborts the ENTIRE stack with a bare
# "no matching manifest for linux/arm64/v8" the moment it reaches such
# an image, so one amd64-only adapter takes down the whole OpenNVR
# install on an Apple Silicon Mac or a Pi 5.
#
# The earlier "arm64 wheel coverage is uneven" note no longer holds.
# Every pinned dependency across these adapters now publishes
# manylinux aarch64 wheels — onnxruntime, opencv-python-headless,
# numpy, scipy, pydantic-core, pillow, tokenizers, ctranslate2, av
# (faster-whisper's PyAV), piper-phonemize, pywhispercpp — so no
# adapter falls back to a source build on the arm64 leg. Verified
# against the PyPI file lists for the exact pinned versions; re-check
# when bumping a pin, because a regression there is invisible until
# an arm64 build starts compiling and times out.
#
# The two exceptions are llamacpp and smolvlm, which derive FROM
# ghcr.io/ggml-org/llama.cpp:server. Upstream does not publish a
# linux/arm64 manifest for that image (ggml-org/llama.cpp#19177 —
# arm64 was built at one point and then disabled), so those two stay
# amd64-only until upstream restores it or we vendor our own
# llama-server build. Flip their ``platforms`` value when that lands.
#
# The arm64 leg builds under QEMU on the amd64 runner. That is
# acceptable here because every adapter installs pre-built wheels
# rather than compiling: the emulated work is pip unpacking archives,
# not gcc.

name: publish-images

on:
  # NB: no ``paths`` filter on the push event. As publish-sdk.yml
  # explains in detail, GitHub applies push-level path filters to
  # both branch and tag refs, which means a release tag pointing at
  # a commit that doesn't touch an adapter would silently skip the
  # publish. Build-on-every-main-push is cheap (BuildKit cache,
  # adapter Dockerfiles change rarely) and the alternative landmine
  # is not worth it.
  push:
    # Every branch push publishes images tagged :<branch> + :sha-<short>
    # (matching open-nvr's publish-images.yml policy), so a feature
    # branch's adapters are pullable for integration testing without a
    # merge to main — e.g. the camera-agent-lite compose can pin
    # ADAPTER_TAG=camera-agent-lite. The :latest tag stays gated below
    # to the default branch / release tags, so branch builds never
    # clobber the release tags.
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "adapters/**"
      - "app/**"
      - "opennvr_adapter_sdk/**"
      - ".github/workflows/publish-images.yml"
  # Manual lever for emergency rebuilds (e.g., upstream base image
  # CVE that needs a re-publish without touching repo content).
  workflow_dispatch:

# Keep multiple in-flight runs on the same ref from racing each other
# to GHCR. Tag refs are unique per release so they never get
# cancelled by a follow-up commit — same shape as publish-sdk.yml.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default. The push job re-declares ``packages: write`` for
# itself; this top-level read-only block stops a future repo-wide
# "make GITHUB_TOKEN read+write by default" change from silently
# widening permissions on PR-from-fork runs.
permissions:
  contents: read

jobs:
  build-and-push:
    name: ${{ matrix.adapter.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io/open-nvr/*
    strategy:
      # One adapter failing should not cancel the other five — fail-fast
      # in matrix mode wastes a 20-minute build because of an unrelated
      # transient pip resolver hiccup.
      fail-fast: false
      matrix:
        adapter:
          # ``dir`` is the adapters/<dir> path. ``image`` is the GHCR
          # repo name — hyphenated even when ``dir`` uses an underscore
          # (fast_plate_ocr → fast-plate-ocr-adapter), matching the
          # Docker / CLI convention community users expect.
          - { dir: yolov8,         image: yolov8-adapter,         port: 9002, platforms: "linux/amd64,linux/arm64" }
          - { dir: piper,          image: piper-adapter,          port: 9001, platforms: "linux/amd64,linux/arm64" }
          - { dir: whisper,        image: whisper-adapter,        port: 9003, platforms: "linux/amd64,linux/arm64" }
          - { dir: fast_plate_ocr, image: fast-plate-ocr-adapter, port: 9004, platforms: "linux/amd64,linux/arm64" }
          - { dir: insightface,    image: insightface-adapter,    port: 9005, platforms: "linux/amd64,linux/arm64" }
          - { dir: blip,           image: blip-adapter,           port: 9006, platforms: "linux/amd64,linux/arm64" }
          - { dir: bytetrack,      image: bytetrack-adapter,      port: 9007, platforms: "linux/amd64,linux/arm64" }
          # Moondream2 vision-language model — VQA + captioning (drop-in for the
          # BLIP caption slot, but answers questions about the scene).
          - { dir: moondream,      image: moondream-adapter,      port: 9008, platforms: "linux/amd64,linux/arm64" }
          # Combined Whisper+Piper+BLIP in one image (issue #82): three voice
          # adapters, one container, same per-adapter /infer contract.
          - { dir: voice-bundle,   image: voice-adapter,          port: 9006, platforms: "linux/amd64,linux/arm64" }
          # The camera-agent-lite native-runtime stack (llama.cpp family,
          # torch-free). Weights are NOT baked in — each adapter downloads
          # its model from HuggingFace on first boot into its weights
          # volume (whisper-adapter precedent), so the images stay small.
          - { dir: pipertts,       image: pipertts-adapter,       port: 9012, platforms: "linux/amd64,linux/arm64" }
          - { dir: whispercpp,     image: whispercpp-adapter,     port: 9013, platforms: "linux/amd64,linux/arm64" }
          - { dir: llamacpp,       image: llamacpp-adapter,       port: 9014, platforms: "linux/amd64" }  # ggml-org/llama.cpp#19177
          - { dir: smolvlm,        image: smolvlm-adapter,        port: 9016, platforms: "linux/amd64" }  # ggml-org/llama.cpp#19177
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registers binfmt_misc handlers so the amd64 runner can execute
      # arm64 binaries inside the build. Cheap (a few seconds) and a
      # no-op for the two adapters that stay amd64-only, so it is not
      # worth conditioning on the matrix entry.
      - name: Set up QEMU (cross-arch emulation for the arm64 leg)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in on the push paths. PR-from-fork builds run with a
      # read-only GITHUB_TOKEN and would fail the login step otherwise.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action computes the full tag set + OCI labels
      # in one place. The label block populates org.opencontainers.
      # image.{source,revision,version,licenses,title,description} so
      # ``docker inspect`` on a pulled image points back at the exact
      # commit + repo it came from — important for the audit story.
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-nvr/${{ matrix.adapter.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest tracks the most recent build on the default branch
            # (main) AND any subsequent release tag. Tier 0 compose pins
            # :latest, so operators trying the project before the first
            # ``v*`` tag still get a working image. Once we cross v1.0
            # the policy may tighten to "release tags only" — for v0.1
            # we keep this loose because the Tier 0 promise depends on
            # :latest existing the moment the project is announced.
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OpenNVR ${{ matrix.adapter.image }}
            org.opencontainers.image.description=OpenNVR AI Adapter Contract v1 — ${{ matrix.adapter.dir }} adapter, port ${{ matrix.adapter.port }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=OpenNVR
            org.opencontainers.image.documentation=https://github.com/open-nvr/ai-adapter/blob/main/adapters/${{ matrix.adapter.dir }}/README.md

      - name: Build${{ github.event_name != 'pull_request' && ' + push' || ' (no push)' }}
        uses: docker/build-push-action@v5
        with:
          # Build context must be the repo root — adapter Dockerfiles
          # COPY from app/, opennvr_adapter_sdk/, and adapters/<name>/.
          context: .
          file: adapters/${{ matrix.adapter.dir }}/Dockerfile
          # PR builds are pinned to linux/amd64 regardless of the matrix
          # entry: the smoke step below needs ``load: true``, and the
          # local docker daemon cannot hold a multi-platform image (nor
          # could it `docker run` the arm64 half). Push builds use the
          # adapter's declared platforms and publish a manifest list.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.adapter.platforms }}
          # PR builds: --load to local daemon for the smoke layer
          # below; main + tag builds: --push to GHCR.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          # On PRs we additionally tag the loaded image with a fixed
          # ``local-smoke`` tag so the smoke step below has a
          # deterministic reference. metadata-action's PR-event tag
          # format has churned across versions; pinning a known tag
          # is cheaper than chasing those changes.
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/open-nvr/{0}:local-smoke', matrix.adapter.image) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend keeps layer cache across runs
          # without us managing an external registry — type=gha is the
          # right backend for this volume of builds. ``mode=max``
          # caches all stages, including the heavy pip install layer
          # that dominates wall time.
          cache-from: type=gha,scope=${{ matrix.adapter.image }}
          cache-to: type=gha,scope=${{ matrix.adapter.image }},mode=max

      # On PR builds we don't push, so verify the image at least boots
      # to a healthy /health response. Catches the class of failures
      # that the in-CI smoke matrix would catch on merge — but earlier,
      # blocking the merge instead of failing post-merge.
      - name: Smoke-test the built image (PR only)
        if: github.event_name == 'pull_request'
        env:
          ADAPTER_IMAGE: ghcr.io/open-nvr/${{ matrix.adapter.image }}:local-smoke
          ADAPTER_PORT: ${{ matrix.adapter.port }}
        run: |
          set -euo pipefail
          # ``docker run -d`` returns the container ID we trap on. The
          # token can be any non-empty string — the adapter only checks
          # ``len(token) > 0`` at boot, and disables auth on /health.
          CID=$(docker run -d \
            -e OPENNVR_ADAPTER_TOKEN=smoke-token \
            -p 127.0.0.1:${ADAPTER_PORT}:${ADAPTER_PORT} \
            "$ADAPTER_IMAGE")
          trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
          # Wait up to 5 minutes for /health to respond — matches the
          # ci.yml smoke matrix's 300s poll. Heavy adapters (BLIP,
          # whisper) take 60-90s to download weights on first boot.
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${ADAPTER_PORT}/health" >/dev/null; then
              echo "Adapter $ADAPTER_IMAGE healthy after ${i}x5s."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Adapter $ADAPTER_IMAGE never reached /health within 5 minutes." >&2
          docker logs "$CID" >&2 || true
          exit 1
